services:
  - type: web
    name: strangerhelp
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server/entry.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4321
      - key: MONGODB_URI
        sync: false
